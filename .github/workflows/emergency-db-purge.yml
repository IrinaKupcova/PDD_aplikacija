# Avārijas DB tīrīšana — palaidās arī pēc push.
# Secrets: SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF (Management SQL)
#          + VITE_SUPABASE_URL / SUPABASE_URL + KEY (REST fallback)
name: Emergency DB purge (chat + old audit)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/emergency-db-purge.yml"
      - "supabase/PIEMEROT_DZES_CHAT_UN_VECO_AUDIT.sql"
      - "supabase/PIEMEROT_TIKAI_CHAT_TRUNCATE.sql"
      - "arhiva/avarijas_tirisana_rest.py"

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Management API — SQL pa vienai komandai
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != '' }}
        continue-on-error: true
        run: |
          REF="$SUPABASE_PROJECT_REF"
          TOKEN="$SUPABASE_ACCESS_TOKEN"
          echo "Management API → $REF"
          post_sql() {
            local name="$1"
            local query="$2"
            local max="${3:-120}"
            body=$(python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "$query")
            echo "=== $name ==="
            code=$(curl -sS -m "$max" -o "/tmp/${name}.json" -w "%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$body" || echo "000")
            echo "HTTP $code"
            head -c 2000 "/tmp/${name}.json" || true
            echo
            case "$code" in
              200|201) echo OK ;;
              *) echo "FAIL $name"; return 1 ;;
            esac
          }

          # Viena komanda = viens pieprasījums (Management API bieži neņem multi-statement)
          post_sql trunc_reactions 'TRUNCATE TABLE public.pdd_ideju_chat_reactions;' || \
            post_sql del_reactions 'DELETE FROM public.pdd_ideju_chat_reactions;' || true

          post_sql trunc_chat 'TRUNCATE TABLE public.pdd_ideju_chat;' || \
            post_sql del_chat 'DELETE FROM public.pdd_ideju_chat;' || true

          post_sql audit_ascii 'DELETE FROM public."Auditacijas_vesture" WHERE ts < (date_trunc(''month'', CURRENT_DATE) - interval ''1 month'');' || \
            post_sql audit_ascii2 'DELETE FROM public."Auditacijas_vesture" WHERE created_at < (date_trunc(''month'', CURRENT_DATE) - interval ''1 month'');' || true

          post_sql audit_uni 'DELETE FROM public."Auditacijas_vēsture" WHERE ts < (date_trunc(''month'', CURRENT_DATE) - interval ''1 month'');' || \
            post_sql audit_uni2 'DELETE FROM public."Auditacijas_vēsture" WHERE created_at < (date_trunc(''month'', CURRENT_DATE) - interval ''1 month'');' || true

          post_sql strip_img 'UPDATE public."AKTUALITATES" SET "Kas_sodien_vel_aktuals" = regexp_replace("Kas_sodien_vel_aktuals", ''<img[^>]*>'', ''<p><em>[Attēls noņemts]</em></p>'', ''gi'') WHERE "Kas_sodien_vel_aktuals" ~* ''<img'';' 240 || true

          echo "Management API batch finished"

      - name: REST — čats (vienmēr mēģina)
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_KEY != '' }}
        continue-on-error: true
        run: |
          set +e
          BASE="${SUPABASE_URL%/}/rest/v1"
          H=(-H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}" -H "Prefer: return=minimal")
          for i in 1 2 3 4 5; do
            echo "REST round $i"
            code1=$(curl -sS -m 35 -o /tmp/r1.txt -w "%{http_code}" -X DELETE "${H[@]}" "${BASE}/pdd_ideju_chat_reactions?created_at=gte.1970-01-01" || echo 000)
            code2=$(curl -sS -m 35 -o /tmp/r2.txt -w "%{http_code}" -X DELETE "${H[@]}" "${BASE}/pdd_ideju_chat?created_at=gte.1970-01-01" || echo 000)
            echo "reactions=$code1 chat=$code2"
            sleep 2
          done

      - name: psql (ja ir DB parole)
        if: ${{ env.SUPABASE_DB_PASSWORD != '' && env.SUPABASE_PROJECT_REF != '' }}
        continue-on-error: true
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          HOST="db.${SUPABASE_PROJECT_REF}.supabase.co"
          psql "host=$HOST port=5432 dbname=postgres user=postgres sslmode=require connect_timeout=25" \
            -v ON_ERROR_STOP=0 \
            -c "SET statement_timeout='120s';" \
            -c "TRUNCATE TABLE public.pdd_ideju_chat_reactions;" \
            -c "TRUNCATE TABLE public.pdd_ideju_chat;"
          echo "psql done"

      - name: Kopsavilkums
        run: |
          echo "Atver Actions logu un pārbaudi HTTP kodus."
          echo "Ja viss FAIL — īslaicīgi Upgrade uz Pro, tad SQL Editor → PIEMEROT_TIKAI_CHAT_TRUNCATE.sql"
