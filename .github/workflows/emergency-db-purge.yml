# Avārijas DB tīrīšana — palaidās arī pēc push (nav vajadzīga "Run workflow" poga).
# Secrets (jebkurš variants):
#   SUPABASE_SERVICE_ROLE_KEY  VAI  VITE_SUPABASE_ANON_KEY
#   SUPABASE_URL  VAI  VITE_SUPABASE_URL
# Labāk arī: SUPABASE_DB_PASSWORD + SUPABASE_PROJECT_REF
name: Emergency DB purge (chat + old audit)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/emergency-db-purge.yml"
      - "supabase/PIEMEROT_DZES_CHAT_UN_VECO_AUDIT.sql"
      - "supabase/PIEMEROT_TIKAI_CHAT_TRUNCATE.sql"
      - "arhiva/avarijas_tirisana_rest.py"

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Pārbauda secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Trūkst URL (SUPABASE_URL/VITE_SUPABASE_URL) vai KEY (SERVICE_ROLE / VITE_SUPABASE_ANON_KEY)"
            exit 1
          fi
          echo "URL=${SUPABASE_URL}"
          echo "KEY length=${#SUPABASE_KEY}"

      - name: REST — čats (mazās partijās, īss timeout)
        run: |
          set +e
          BASE="${SUPABASE_URL%/}/rest/v1"
          AUTH=(-H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}")
          for round in $(seq 1 40); do
            echo "=== chat purge round $round ==="
            IDS=$(curl -sS -m 25 "${AUTH[@]}" \
              -H "Accept: application/json" \
              "${BASE}/pdd_ideju_chat?select=id&limit=20" || true)
            echo "ids sample: ${IDS:0:180}"
            if [ -z "$IDS" ] || [ "$IDS" = "[]" ]; then
              echo "chat empty or unreachable"
              break
            fi
            curl -sS -m 40 -X DELETE "${AUTH[@]}" -H "Prefer: return=minimal" \
              "${BASE}/pdd_ideju_chat_reactions?created_at=gte.1970-01-01" || true
            curl -sS -m 40 -X DELETE "${AUTH[@]}" -H "Prefer: return=minimal" \
              "${BASE}/pdd_ideju_chat?created_at=gte.1970-01-01" || true
            sleep 2
          done
          echo "REST chat finished"

      - name: REST — audit (cutoff = iepriekšējā mēneša 1.)
        run: |
          set +e
          BASE="${SUPABASE_URL%/}/rest/v1"
          AUTH=(-H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}" -H "Prefer: return=minimal")
          CUTOFF=$(python3 - <<'PY'
          from datetime import date
          d = date.today().replace(day=1)
          m = d.month - 1 or 12
          y = d.year if d.month > 1 else d.year - 1
          print(f"{y:04d}-{m:02d}-01T00:00:00Z")
          PY
          )
          echo "cutoff=$CUTOFF"
          for T in "Auditacijas_vesture" "Auditacijas_vēsture"; do
            for col in ts created_at Laiks; do
              echo "DELETE $T $col lt cutoff"
              curl -sS -m 45 -G -X DELETE "${BASE}/${T}" \
                --data-urlencode "${col}=lt.${CUTOFF}" \
                "${AUTH[@]}" || true
            done
          done
          echo "REST audit finished"

      - name: REST — noņem <img> no aktualitātēm (vislielākā vieta)
        run: |
          set +e
          BASE="${SUPABASE_URL%/}/rest/v1"
          AUTH=(-H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}" -H "Content-Type: application/json" -H "Prefer: return=minimal")
          python3 - <<'PY'
          import json, os, ssl, urllib.request, re, time
          BASE = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1"
          KEY = os.environ["SUPABASE_KEY"]
          ctx = ssl.create_default_context()
          def req(method, path, body=None, timeout=35):
              url = f"{BASE}/{path}"
              data = None if body is None else json.dumps(body).encode()
              r = urllib.request.Request(url, data=data, method=method, headers={
                  "apikey": KEY, "Authorization": f"Bearer {KEY}",
                  "Content-Type": "application/json", "Prefer": "return=representation",
                  "Accept": "application/json",
              })
              try:
                  with urllib.request.urlopen(r, timeout=timeout, context=ctx) as resp:
                      return resp.status, resp.read().decode("utf-8", "replace")
              except Exception as e:
                  return 0, str(e)
          # fetch light rows
          status, raw = req("GET", "AKTUALITATES?select=id,Kas_sodien_vel_aktuals&limit=80")
          print("fetch", status, raw[:200])
          if status not in (200,) or not raw.startswith("["):
              raise SystemExit(0)
          rows = json.loads(raw)
          repl = "<p><em>[Attēls noņemts — vietas taupīšanai]</em></p>"
          patched = 0
          for row in rows:
              html = row.get("Kas_sodien_vel_aktuals") or ""
              if "<img" not in html.lower():
                  continue
              new_html = re.sub(r"<img[^>]*>", repl, html, flags=re.I)
              rid = row["id"]
              st, body = req("PATCH", f"AKTUALITATES?id=eq.{rid}", {"Kas_sodien_vel_aktuals": new_html}, timeout=45)
              print("patch", rid, st, body[:120])
              if st in (200, 204):
                  patched += 1
              time.sleep(0.4)
          print("patched_images", patched)
          PY
          echo "image strip finished"

      - name: psql TRUNCATE (ja ir DB parole)
        if: ${{ env.SUPABASE_DB_PASSWORD != '' && env.SUPABASE_PROJECT_REF != '' }}
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          HOST="db.${SUPABASE_PROJECT_REF}.supabase.co"
          echo "psql -> $HOST"
          psql "host=$HOST port=5432 dbname=postgres user=postgres sslmode=require connect_timeout=20" \
            -v ON_ERROR_STOP=0 \
            -c "SET statement_timeout='90s';" \
            -c "TRUNCATE TABLE IF EXISTS public.pdd_ideju_chat_reactions;" \
            -c "TRUNCATE TABLE IF EXISTS public.pdd_ideju_chat;" \
            -f supabase/PIEMEROT_DZES_CHAT_UN_VECO_AUDIT.sql
          echo "psql done"
