# Avārijas DB tīrīšana — palaidās arī pēc push (nav vajadzīga "Run workflow" poga).
# Secrets:
#   SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF  (labākais — Management API SQL)
#   VAI SUPABASE_SERVICE_ROLE_KEY / VITE_SUPABASE_ANON_KEY + URL (REST)
#   VAI SUPABASE_DB_PASSWORD + PROJECT_REF (psql)
name: Emergency DB purge (chat + old audit)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/emergency-db-purge.yml"
      - "supabase/PIEMEROT_DZES_CHAT_UN_VECO_AUDIT.sql"
      - "supabase/PIEMEROT_TIKAI_CHAT_TRUNCATE.sql"
      - "arhiva/avarijas_tirisana_rest.py"

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Management API — TRUNCATE čats + vecā auditācija
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != '' }}
        run: |
          set -e
          REF="$SUPABASE_PROJECT_REF"
          TOKEN="$SUPABASE_ACCESS_TOKEN"
          echo "Management API SQL → project $REF"
          BODY1=$(python3 - <<'PY'
          import json
          q = """
          TRUNCATE TABLE IF EXISTS public.pdd_ideju_chat_reactions;
          TRUNCATE TABLE IF EXISTS public.pdd_ideju_chat;
          """
          print(json.dumps({"query": q}))
          PY
          )
          echo "SQL1 truncate chat..."
          curl -sS -m 120 -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY1" | tee /tmp/sql1.json
          echo
          BODY2=$(python3 - <<'PY'
          import json
          q = """
          DO $$
          DECLARE
            cutoff timestamptz := (date_trunc('month', CURRENT_DATE) - interval '1 month');
          BEGIN
            BEGIN
              DELETE FROM public."Auditacijas_vesture" WHERE ts < cutoff;
            EXCEPTION WHEN undefined_table OR undefined_column THEN
              BEGIN
                DELETE FROM public."Auditacijas_vesture" WHERE created_at < cutoff;
              EXCEPTION WHEN OTHERS THEN
                RAISE NOTICE 'audit ascii skip %', SQLERRM;
              END;
            END;
            BEGIN
              DELETE FROM public."Auditacijas_vēsture" WHERE ts < cutoff;
            EXCEPTION WHEN undefined_table OR undefined_column THEN
              BEGIN
                DELETE FROM public."Auditacijas_vēsture" WHERE created_at < cutoff;
              EXCEPTION WHEN OTHERS THEN
                RAISE NOTICE 'audit unicode skip %', SQLERRM;
              END;
            END;
          END $$;
          """
          print(json.dumps({"query": q}))
          PY
          )
          echo "SQL2 purge audit..."
          curl -sS -m 180 -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY2" | tee /tmp/sql2.json
          echo
          BODY3=$(python3 - <<'PY'
          import json
          q = r"""
          UPDATE public."AKTUALITATES"
          SET "Kas_sodien_vel_aktuals" = regexp_replace(
            "Kas_sodien_vel_aktuals",
            '<img[^>]*>',
            '<p><em>[Attēls noņemts]</em></p>',
            'gi'
          )
          WHERE "Kas_sodien_vel_aktuals" ~* '<img';
          """
          print(json.dumps({"query": q}))
          PY
          )
          echo "SQL3 strip images..."
          curl -sS -m 240 -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY3" | tee /tmp/sql3.json
          echo
          echo "Management API steps done"

      - name: Brīdinājums ja nav access token
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == '' }}
        run: |
          echo "::warning::Nav SUPABASE_ACCESS_TOKEN vai SUPABASE_PROJECT_REF — Management SQL izlaists."

      - name: REST fallback — čats
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_KEY != '' }}
        run: |
          set +e
          BASE="${SUPABASE_URL%/}/rest/v1"
          AUTH=(-H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}" -H "Prefer: return=minimal")
          echo "REST delete chat..."
          curl -sS -m 40 -X DELETE "${AUTH[@]}" "${BASE}/pdd_ideju_chat_reactions?created_at=gte.1970-01-01" || true
          curl -sS -m 40 -X DELETE "${AUTH[@]}" "${BASE}/pdd_ideju_chat?created_at=gte.1970-01-01" || true
          echo "REST chat done"

      - name: psql (ja ir DB parole)
        if: ${{ env.SUPABASE_DB_PASSWORD != '' && env.SUPABASE_PROJECT_REF != '' }}
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          HOST="db.${SUPABASE_PROJECT_REF}.supabase.co"
          psql "host=$HOST port=5432 dbname=postgres user=postgres sslmode=require connect_timeout=20" \
            -v ON_ERROR_STOP=0 \
            -c "SET statement_timeout='90s';" \
            -c "TRUNCATE TABLE IF EXISTS public.pdd_ideju_chat_reactions;" \
            -c "TRUNCATE TABLE IF EXISTS public.pdd_ideju_chat;"
          echo "psql done"
