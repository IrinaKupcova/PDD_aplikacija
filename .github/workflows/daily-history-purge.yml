# Ikdienas vēstures tīrīšana: dzēš datus vecākus par ~1,5 mēnešiem (45 dienām).
# Secrets: SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF (labākais)
#          un/vai SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY / VITE_SUPABASE_ANON_KEY
name: Daily history retention purge

on:
  schedule:
    - cron: "15 2 * * *" # katru dienu 02:15 UTC
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Management API SQL (45 dienas)
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != '' }}
        continue-on-error: true
        run: |
          REF="$SUPABASE_PROJECT_REF"
          TOKEN="$SUPABASE_ACCESS_TOKEN"
          post_sql() {
            local name="$1"
            local query="$2"
            body=$(python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "$query")
            code=$(curl -sS -m 90 -o "/tmp/${name}.json" -w "%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$body" || echo "000")
            echo "$name HTTP $code"
            head -c 400 "/tmp/${name}.json" || true
            echo
          }
          post_sql del_akt 'DELETE FROM public."AKTUALITATES" WHERE "Beigas" < (CURRENT_DATE - interval '"'"'45 days'"'"');'
          post_sql del_prom 'DELETE FROM public.prombutnes_dati WHERE "Beigu_datums" < (CURRENT_DATE - interval '"'"'45 days'"'"');'
          post_sql del_audit 'DELETE FROM public."Auditacijas_vesture" WHERE ts < ((CURRENT_DATE - interval '"'"'45 days'"'"')::timestamptz);'
          post_sql trunc_rx 'TRUNCATE TABLE public.aktualitates_reactions;'
          post_sql trunc_chat 'TRUNCATE TABLE public.pdd_ideju_chat;'
          post_sql trunc_chatrx 'TRUNCATE TABLE public.pdd_ideju_chat_reactions;'

      - name: REST fallback
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_KEY != '' }}
        continue-on-error: true
        run: |
          set +e
          BASE="${SUPABASE_URL%/}/rest/v1"
          H=(-H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}" -H "Prefer: return=minimal")
          CUTOFF=$(python3 - <<'PY'
          from datetime import date, timedelta
          print((date.today() - timedelta(days=45)).isoformat())
          PY
          )
          echo "cutoff=$CUTOFF"
          curl -sS -m 60 -G -X DELETE "${BASE}/AKTUALITATES" --data-urlencode "Beigas=lt.${CUTOFF}" "${H[@]}" || true
          curl -sS -m 60 -G -X DELETE "${BASE}/prombutnes_dati" --data-urlencode "Beigu_datums=lt.${CUTOFF}" "${H[@]}" || true
          curl -sS -m 60 -G -X DELETE "${BASE}/Auditacijas_vesture" --data-urlencode "ts=lt.${CUTOFF}T00:00:00Z" "${H[@]}" || true
          curl -sS -m 40 -X DELETE "${BASE}/aktualitates_reactions?created_at=gte.1970-01-01" "${H[@]}" || true
          echo done
